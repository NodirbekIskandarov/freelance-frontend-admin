services:
  admin:
    build:
      context: .
      target: dev
    image: yopamiz-admin:dev
    container_name: yopamiz-admin
    ports:
      - '8091:8091'
    environment:
      # Nisbiy manzil — Vite dev proksisi orqali API_UPSTREAM'ga boradi.
      VITE_API_URL: ${VITE_API_URL:-/api/v1}
      API_UPSTREAM: ${API_UPSTREAM:-https://api.yopamiz.uz}
    volumes:
      # Kod host'dan ulanadi — HMR ishlaydi.
      - .:/app
      # node_modules konteyner ichidagisi bo'lib qoladi — host papkasi uni bosmaydi.
      - /app/node_modules
    restart: unless-stopped

  # Production build + nginx. `docker compose --profile prod up --build`
  admin-prod:
    profiles: ['prod']
    build:
      context: .
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: yopamiz-admin:prod
    container_name: yopamiz-admin-prod
    ports:
      - '8091:8091'
    environment:
      # nginx shabloni ishga tushishda shu manzilga proksi ochadi.
      API_UPSTREAM: ${API_UPSTREAM:-https://api.yopamiz.uz}
    restart: unless-stopped

