server {
    listen 8091;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hash'langan asset'lar — uzoq muddatli cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker hech qachon cache'lanmaydi.
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SPA: barcha marshrutlar index.html ga (react-router client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
