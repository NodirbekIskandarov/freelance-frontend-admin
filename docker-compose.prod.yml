# Production rejimi (serverda CI/CD shu faylni ishlatadi):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Barcha sozlamalar server'dagi `.env` faylidan olinadi (compose uni avtomatik
# o'qiydi). VITE_* qiymatlari build paytida bundle ichiga yoziladi — ya'ni
# `.env` o'zgarsa, konteynerni qayta *build* qilish shart (deploy shuni qiladi),
# faqat restart yetarli emas.
services:
  admin:
    build:
      context: .
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:?.env da VITE_API_URL ko'rsatilmagan}
    image: yopamiz-admin:prod
    container_name: yopamiz-admin
    restart: unless-stopped
    environment:
      # Konteyner ichidagi nginx `/api/` ni shu manzilga proksilaydi.
      # Faqat VITE_API_URL nisbiy bo'lganda ishlatiladi.
      API_UPSTREAM: ${API_UPSTREAM:-https://api.yopamiz.uz}
    ports:
      # Host porti .env dagi ADMIN_PORT bilan boshqariladi.
      - '${ADMIN_PORT:-8091}:8091'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8091/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
